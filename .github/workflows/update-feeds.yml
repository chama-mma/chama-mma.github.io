name: Update MMA Feeds & Rankings

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap (prevents push conflicts)
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund --loglevel=error rss-parser node-fetch@2 date-fns jsdom

      - name: Fetch news feeds
        run: node scripts/update-feeds.js
        continue-on-error: true
        timeout-minutes: 3

      - name: Fetch UFC rankings
        run: node scripts/update-rankings.js
        continue-on-error: true
        timeout-minutes: 2

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          [ -f feeds.json ] && git add feeds.json
          [ -f rankings.json ] && git add rankings.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update MMA feeds & rankings $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
